name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    name: Lint & Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (Lint)
        run: npm run lint

      - name: Build extension bundle
        run: npm run build

      - name: Verify build artifacts
        run: |
          echo "Checking essential extension distribution files..."
          test -f dist/manifest.json || { echo "Missing dist/manifest.json"; exit 1; }
          test -f dist/service-worker.js || { echo "Missing dist/service-worker.js"; exit 1; }
          test -f dist/content/detector.js || { echo "Missing dist/content/detector.js"; exit 1; }
          test -f dist/content/widget.css || { echo "Missing dist/content/widget.css"; exit 1; }
          test -f dist/src/sidepanel/index.html || { echo "Missing dist/src/sidepanel/index.html"; exit 1; }
          echo "All essential extension files present in dist/."

      - name: Package extension (.zip)
        run: npm run zip

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: hckr-tools-browser-extension-zip
          path: hckr-tools-browser-extension.zip
          retention-days: 30

      - name: Upload dist build directory
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          retention-days: 14

  e2e-test:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension bundle
        run: npm run build

      - name: Install Playwright Chromium & dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Upload Playwright test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces & failure test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
